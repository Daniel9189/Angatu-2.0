services:
  db:
    image: postgres:16-alpine
    container_name: angatu_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=angatu
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    volumes:
      - angatu_pgdata:/var/lib/postgresql/data

volumes:
  angatu_pgdata:
